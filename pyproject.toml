[project]
name = "schemamodels"
version = "1.1.0"
description = "Dynamically create useful data classes from JSON schemas"
authors = [{ name = "'Jurnell Cockhren'", email = "jurnell@civichacker.com" }]
requires-python = ">=3.11,<4"
readme = "README.md"
license = "GPL-3.0-or-later"
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: File Formats :: JSON",
    "Topic :: File Formats :: JSON :: JSON Schema",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0,<9.1.0",
    "ipython>=8.10.0,<9",
    "jsonschema>=4.17.3,<5",
    "vulture>=2.6,<3",
    "flake8>=6.0.0,<7 ; python_full_version >= '3.11'",
    "pytest-cov>=4.0.0,<5",
    "reuse>=6.3.0,<7",
    "ruff>=0.17.3,<0.18.0",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.ruff.lint]
ignore = ["EXE001"]
select = ["E741"]

[project.urls]
Homepage = "https://github.com/civichacker/schemamodels"
Funding = "https://github.com/sponsors/civichacker"
Source = "https://github.com/civichacker/schemamodels"
